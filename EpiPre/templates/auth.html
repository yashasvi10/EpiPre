{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-4"><div class="card p-4"><h2>{{ mode|title }}</h2><form method="post">{% if mode=='register' %}<label class="form-label">Name</label><input class="form-control mb-3" name="name" required>{% endif %}<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password (8+ characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><button class="btn btn-primary w-100">{{ mode|title }}</button></form><p class="mt-3 mb-0">{% if mode=='login' %}New? <a href="{{ url_for('register') }}">Register</a>{% else %}Already registered? <a href="{{ url_for('login') }}">Login</a>{% endif %}</p></div></div></div>{% endblock %}
